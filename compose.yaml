services:
  nginx:
    image: nginx:alpine
    container_name: magento249_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - magento

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: magento249_php
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - composer_cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_started
    networks:
      - magento

  db:
    image: mysql:8.4
    container_name: magento249_db
    environment:
      MYSQL_ROOT_PASSWORD: devrootpassword
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: devmagento
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdevrootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - magento

  opensearch:
    image: opensearchproject/opensearch:3
    container_name: magento249_opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - magento

volumes:
  db_data:
  opensearch_data:
  composer_cache:

networks:
  magento:
